<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Squid Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-bg">
  <div class="form-box">
    <h2>Register</h2>
    <input type="text" id="reg-username" placeholder="Enter your name" required />
    <input type="text" id="reg-address" placeholder="Enter your address" required />
    <input type="password" id="reg-password" placeholder="Create a password" required />

    <button onclick="register()">Register</button>
    <p>Already have an account? <a href="/">Login</a></p>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
